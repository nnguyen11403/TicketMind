spring:
  application:
    name: ticketmind-backend
  profiles:
    default: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:ticketmind}
    # The runtime credential is the unprivileged role V3 creates, not the
    # owner. Falling back to the owner keeps a bare `mvnw spring-boot:run`
    # working against a database that has not been migrated yet; compose and
    # any real deployment set APP_DB_USER.
    username: ${APP_DB_USER:${POSTGRES_USER:ticketmind}}
    password: ${APP_DB_PASSWORD:${POSTGRES_PASSWORD:}}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # V3 creates the login roles and needs their passwords as literals. Flyway
    # substitutes these textually, so both must be free of quote characters —
    # generate with `openssl rand -hex 32`. No defaults: an unset value fails
    # the migration rather than provisioning a role with a password that is
    # sitting in the source tree.
    placeholders:
      app_db_password: ${APP_DB_PASSWORD}
      rag_db_password: ${RAG_DB_PASSWORD}

server:
  port: ${BACKEND_PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  max-http-request-header-size: 16KB
  tomcat:
    max-http-form-post-size: 1MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: never
      show-components: never
  info:
    env:
      enabled: false

app:
  security:
    # Refuse any request that did not arrive over TLS (read from
    # X-Forwarded-Proto, since TLS terminates at the proxy). Actuator is exempt
    # so the container healthcheck can probe over loopback. The dev and test
    # profiles turn this off.
    require-https: ${REQUIRE_HTTPS:true}
  crypto:
    # base64-encoded 256-bit key for column-level encryption. No default, for
    # the same reason as app.jwt.secret. Generate with: openssl rand -base64 32
    # Losing it loses every encrypted ticket body — back it up with the
    # database, not in it.
    field-key: ${APP_ENCRYPTION_KEY}
  rls:
    # Every runtime connection switches into this role and stamps the caller's
    # identity into app.user_id / app.user_role, which is what the V3 policies
    # read. Turning this off leaves those variables unset, and the policies
    # then deny everything — it is a diagnostic switch, not a way to opt out.
    enabled: true
    app-role: ticketmind_app
  jwt:
    # Must be at least 32 bytes (256 bits) when decoded. Generate with:
    #   openssl rand -base64 64
    secret: ${JWT_SECRET}
    issuer: ticketmind
    audience: ticketmind-app
    access-token-ttl: PT${JWT_ACCESS_TOKEN_TTL_MINUTES:15}M
    refresh-token-ttl: P${JWT_REFRESH_TOKEN_TTL_DAYS:14}D
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  auth:
    # BCrypt cost factor. 12 is the 2026 baseline; raise as hardware improves.
    bcrypt-strength: 12
    # Password minimum length per OWASP modern guidance (no complexity rules).
    password-min-length: 12
    # Account lockout: lock after N failed attempts for T minutes.
    max-failed-attempts: 5
    lockout-duration: PT15M
    # Promotes this account to ADMIN at startup, but only while no ADMIN
    # exists. Registration always creates a USER and role changes need an
    # ADMIN, so without this a fresh deployment can only reach staff
    # privileges by editing Postgres directly. Register the account first,
    # then start with this set.
    bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
  cookie:
    # Must be true in production (cookie only sent over HTTPS). Override to
    # false in the dev profile to allow local http://localhost testing.
    secure: true
    same-site: Strict
  rag:
    # Triage and knowledge-base mirroring are best-effort enrichment. Turning
    # this off leaves tickets untriaged; it never breaks ticket submission.
    # Defaults off so a bare `mvnw spring-boot:run` works without a RAG key;
    # .env.example and docker-compose turn it on. When it IS on, a blank
    # internal-key fails startup rather than silently 401-ing every call.
    enabled: ${RAG_ENABLED:false}
    base-url: ${RAG_SERVICE_URL:http://localhost:8000}
    # Must match RAG_INTERNAL_API_KEY on the Python service.
    internal-key: ${RAG_INTERNAL_API_KEY:}
    connect-timeout: PT2S
    # Generous because this covers a Claude round-trip, not just a hop to a
    # local service. It runs off the request thread, so it costs no user latency.
    read-timeout: PT45S
  rate-limit:
    # Per-IP buckets sized for the expected human-traffic shape on auth
    # endpoints. Swap for Redis-backed buckets in multi-instance deploys.
    login:
      capacity: 5
      refill-period: PT5M
    register:
      capacity: 3
      refill-period: PT1H
    refresh:
      capacity: 60
      refill-period: PT1H

logging:
  level:
    root: INFO
    com.ticketmind: INFO
    org.springframework: INFO
    org.hibernate.SQL: WARN
