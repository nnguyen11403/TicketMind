name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

# A new push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (JUnit + Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Testcontainers needs a Docker daemon; ubuntu-latest ships one running,
      # so nothing extra is required here.
      - name: Run tests
        working-directory: backend
        run: ./mvnw test -B -ntp

  frontend:
    name: frontend (typecheck, lint, format, vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Format check
        working-directory: frontend
        run: npm run format:check
      - name: Test
        working-directory: frontend
        run: npm test

  rag-service:
    name: rag-service (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: rag-service/uv.lock
      - name: Sync
        working-directory: rag-service
        # --frozen fails rather than silently re-resolving if uv.lock is stale,
        # so a dependency change that was never locked cannot slip through CI.
        run: uv sync --all-groups --frozen
      - name: Lint
        working-directory: rag-service
        run: uv run ruff check .
      - name: Format check
        working-directory: rag-service
        run: uv run ruff format --check .
      - name: Test
        working-directory: rag-service
        run: uv run pytest

  stack:
    name: full stack (docker compose + smoke test)
    runs-on: ubuntu-latest
    # Only worth the build time once the unit suites are green.
    needs: [backend, frontend, rag-service]
    steps:
      - uses: actions/checkout@v4

      - name: Write CI .env
        # Real provider keys are optional. Forks and PR builds do not get
        # repository secrets, so the fallbacks keep this job runnable
        # everywhere — the smoke test degrades to reporting that triage did
        # not land, and still asserts the other 11 things.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        run: |
          {
            echo "POSTGRES_USER=ticketmind"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "POSTGRES_DB=ticketmind"
            echo "POSTGRES_PORT=5432"
            echo "BACKEND_PORT=8080"
            echo "SPRING_PROFILES_ACTIVE=dev"
            echo "JWT_SECRET=$(openssl rand -base64 64 | tr -d '\n')"
            echo "CORS_ALLOWED_ORIGINS=http://localhost:3000"
            echo "FRONTEND_PORT=3000"
            echo "VITE_API_BASE_URL=http://localhost:8080"
            echo "RAG_SERVICE_PORT=8000"
            echo "RAG_INTERNAL_API_KEY=$(openssl rand -hex 32)"
            echo "ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-sk-ant-ci-placeholder}"
            echo "VOYAGE_API_KEY=${VOYAGE_API_KEY:-}"
            echo "RAG_CHAT_MODEL=claude-opus-5"
            echo "RAG_EMBEDDING_MODEL=voyage-3"
          } > .env

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Smoke test
        run: |
          RAG_KEY=$(grep '^RAG_INTERNAL_API_KEY=' .env | cut -d= -f2)
          RAG_KEY="$RAG_KEY" ./scripts/smoke-test.sh

      - name: Service logs
        # The smoke test reports which assertion failed; these say why.
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v
