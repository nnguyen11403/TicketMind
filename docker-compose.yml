# Full local stack: Postgres + pgvector, Spring backend, FastAPI RAG service,
# and the built React frontend behind nginx.
#
#   cp .env.example .env    # then fill in ANTHROPIC_API_KEY / VOYAGE_API_KEY
#   docker compose up --build
#
#   frontend  http://localhost:3000
#   backend   http://localhost:8080
#   RAG       http://localhost:8000
#
# Startup is deliberately serialised postgres -> backend -> rag-service; see
# the comment on rag-service.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ticketmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Bound to the loopback interface, not 0.0.0.0. Every service that needs
      # Postgres reaches it over the compose network; this mapping exists only
      # so a developer can attach psql. Published broadly it would put the
      # owning credential on the host's public interfaces.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: ticketmind-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # application.yml builds the JDBC URL from these rather than taking a
      # whole SPRING_DATASOURCE_URL.
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      # Flyway keeps the owning credential: V3 creates the roles below and
      # grants their privileges, so it cannot run as one of them.
      SPRING_FLYWAY_USER: ${POSTGRES_USER}
      SPRING_FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      # Everything after the migration runs as this unprivileged role, which
      # owns no table and has no BYPASSRLS — that is what puts the V3 policies
      # in force instead of leaving them decorative.
      APP_DB_USER: ticketmind_app
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      # Handed to Flyway as a placeholder so V3 can provision the RAG
      # service's own login role in the same migration.
      RAG_DB_PASSWORD: ${RAG_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      # Must match the origin the browser actually loads the SPA from. If you
      # change FRONTEND_PORT, change this too or every API call is blocked.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      RAG_ENABLED: "true"
      # Service name, not localhost: this call is made from inside the network.
      RAG_SERVICE_URL: http://rag-service:8000
      RAG_INTERNAL_API_KEY: ${RAG_INTERNAL_API_KEY}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  rag-service:
    build:
      context: ./rag-service
    container_name: ticketmind-rag
    restart: unless-stopped
    depends_on:
      # Waits on the BACKEND, not just Postgres. Both services run
      # `CREATE EXTENSION IF NOT EXISTS vector` against the same database at
      # startup, and issuing that concurrently from two connections can fail
      # with a duplicate-key or "tuple concurrently updated" error. Letting
      # the backend's Flyway migration win the race makes the RAG service's
      # copy an unconditional no-op.
      backend:
        condition: service_healthy
    environment:
      # Its own role, created by the backend's V3 migration — which is a second
      # reason this service waits on `backend` rather than on `postgres`. It
      # can create and own kb_documents and nothing else: no read on tickets,
      # users, or refresh_tokens. This is the container that hands text to a
      # third-party model, so it is the one whose reach matters most.
      DATABASE_URL: postgresql://ticketmind_rag:${RAG_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RAG_INTERNAL_API_KEY: ${RAG_INTERNAL_API_KEY}
      # Same key the backend uses, so the mirrored ticket text is encrypted
      # here exactly as it is in `tickets`.
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      RAG_CHAT_MODEL: ${RAG_CHAT_MODEL:-claude-opus-5}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-voyage-3}
    ports:
      - "${RAG_SERVICE_PORT:-8000}:8000"
    # Healthcheck comes from the image, as it does for backend and frontend.
    # It uses the venv interpreter rather than curl, so the runtime stage needs
    # no apt install at all.

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the bundle at build time and read by the BROWSER, so it
        # has to be the host-visible address, `backend` does not resolve on
        # the user's machine. Changing it requires a rebuild, not a restart.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: ticketmind-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  postgres_data:
