# Security headers, in a file because nginx's add_header does not merge across
# levels: a location block that declares even one add_header of its own stops
# inheriting every add_header from the server block. Both /index.html and
# /assets/ set Cache-Control, so without this include they would silently ship
# with no security headers at all — which is exactly what the smoke test caught.
# Any new location that sets a header must include this too.

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

# Only meaningful once TLS terminates upstream, which the redirect in
# nginx.conf enforces. Sent unconditionally because a browser ignores HSTS on a
# plain http response, so there is no case where this is wrong.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# 'unsafe-inline' for style-src only: Tailwind ships as a stylesheet, but Vite
# emits a small inline style block for the initial paint and React sets inline
# styles at runtime. Scripts get no such exemption — the whole bundle is a
# hashed file under /assets, so 'self' covers it and an injected <script> or
# javascript: URL has nothing to fall back to. connect-src has to name the API
# origin explicitly because it is a different port, and therefore a different
# origin, from this one; ${CSP_CONNECT_SRC} is substituted at image build time
# from the same VITE_API_BASE_URL the bundle was compiled against.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ${CSP_CONNECT_SRC}; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
