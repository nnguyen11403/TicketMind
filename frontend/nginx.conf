server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;

    # Vite emits content-hashed filenames for everything under /assets, so the
    # bundles are safe to cache indefinitely. index.html is the only file whose
    # name is stable, so it must never be cached, otherwise a deploy ships new
    # hashed assets that no browser ever learns to ask for.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Unauthenticated liveness probe for the compose healthcheck. Kept separate
    # from the SPA fallback so a probe can never be answered by index.html.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Client-side routing: /tickets/<uuid> is a React Router path, not a file.
    # Anything that isn't a real asset has to fall through to the SPA shell or
    # a deep link would 404 on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # The app calls the backend cross-origin, so nothing here needs to be
    # framed or sniffed. CSP is deliberately absent: Vite injects hashed
    # inline styles, and a wrong CSP that half-works is worse than none.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
}
