server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;

    # Don't advertise the exact nginx build in every response.
    server_tokens off;

    # TLS terminates upstream (proxy, ingress, or CDN), so the scheme the user
    # actually used only survives in X-Forwarded-Proto. Redirect rather than
    # serve: an app that answers over http teaches browsers it is reachable
    # that way, and the session cookie is Secure so the page would half-work.
    # The healthcheck is exempt, the compose probe speaks plain http.
    set $force_https 0;
    if ($http_x_forwarded_proto = "http") {
        set $force_https 1;
    }
    if ($request_uri = "/healthz") {
        set $force_https 0;
    }
    if ($force_https = 1) {
        return 301 https://$host$request_uri;
    }

    # Vite emits content-hashed filenames for everything under /assets, so the
    # bundles are safe to cache indefinitely. index.html is the only file whose
    # name is stable, so it must never be cached, otherwise a deploy ships new
    # hashed assets that no browser ever learns to ask for.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Unauthenticated liveness probe for the compose healthcheck. Kept separate
    # from the SPA fallback so a probe can never be answered by index.html.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Client-side routing: /tickets/<uuid> is a React Router path, not a file.
    # Anything that isn't a real asset has to fall through to the SPA shell or
    # a deep link would 404 on refresh.
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # Also at server level, for anything that does not match a location above.
    include /etc/nginx/security-headers.conf;
}
